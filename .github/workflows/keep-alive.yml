name: Keep-alive Supabase

# Complément du cron Vercel (limité à 1 appel/jour en gratuit) : appelle
# /api/keep-alive toutes les 6 h pour que la base Supabase ne soit pas mise
# en pause. Si l'appel échoue, le workflow passe en rouge et GitHub envoie
# un email.
#
# À configurer une seule fois : GitHub > Settings > Secrets and variables >
# Actions > onglet Variables > New repository variable
#   SITE_URL = https://ton-site.vercel.app

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/keep-alive
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Variable de dépôt SITE_URL absente (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --max-time 60 "${SITE_URL%/}/api/keep-alive"
